<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>渡山记 · 开路将军幻梦卡</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; width: 100%; overflow: hidden; }
body {
  background: #0a0807;
  color: #e8dcc8;
  font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}

/* 雾气背景层 */
.fog {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(90,75,55,0.14) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(60,48,38,0.18) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 50%, rgba(30,22,18,0.25) 0%, #0a0807 80%);
}
.fog::before, .fog::after {
  content: ""; position: absolute; inset: -20%;
  background: radial-gradient(circle, rgba(200,180,140,0.045) 0%, transparent 40%);
  animation: drift 32s ease-in-out infinite;
}
.fog::after { animation-duration: 48s; animation-direction: reverse; opacity: 0.6; }
@keyframes drift {
  0%, 100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(4%, -3%) scale(1.05); }
}

/* 屏幕容器 */
.screen {
  position: fixed; inset: 0; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 70px 24px 70px;
  cursor: pointer;
}
#title-screen, #end-screen {
  justify-content: center;
  background: radial-gradient(ellipse at center, #1a1410 0%, #0a0807 72%);
}
#game-screen {
  justify-content: flex-start;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#game-screen::-webkit-scrollbar { width: 0; height: 0; }
#game-content {
  width: 100%;
  max-width: 680px;
  margin: auto 0;
  padding-bottom: 40px;
}

/* 标题页 */
.title-main {
  font-size: clamp(52px, 10vw, 104px);
  letter-spacing: 0.3em;
  color: #c9a961;
  margin-bottom: 10px;
  font-weight: 400;
  text-shadow: 0 0 40px rgba(201,169,97,0.25);
  padding-left: 0.3em;
}
.title-divider {
  width: 60px; height: 1px;
  background: linear-gradient(90deg, transparent, #8a7a65, transparent);
  margin: 20px 0 24px;
}
.title-sub {
  font-size: clamp(13px, 2.4vw, 16px);
  letter-spacing: 0.6em;
  color: #8a7a65;
  margin-bottom: 64px;
  padding-left: 0.6em;
}
.title-quote {
  max-width: 540px;
  font-size: clamp(15px, 2.6vw, 18px);
  line-height: 2.4;
  color: #b8a888;
  text-align: center;
  margin-bottom: 80px;
  font-style: italic;
}
.title-hint {
  font-size: 13px;
  letter-spacing: 0.5em;
  color: #6a5a45;
  animation: pulse 2.6s ease-in-out infinite;
  padding-left: 0.5em;
}
@keyframes pulse {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 0.95; }
}

/* 幕头 */
.act-header {
  text-align: center;
  margin-bottom: 44px;
  animation: fadeIn 1.2s ease;
}
.act-number {
  font-size: 12px;
  letter-spacing: 0.7em;
  color: #6a5a45;
  margin-bottom: 18px;
  padding-left: 0.7em;
}
.act-title {
  font-size: clamp(28px, 5.5vw, 42px);
  letter-spacing: 0.25em;
  color: #c9a961;
  margin-bottom: 36px;
  padding-left: 0.25em;
}
.act-scene {
  max-width: 560px;
  margin: 0 auto;
  font-size: clamp(13px, 2.2vw, 15px);
  line-height: 2.1;
  color: #7a6a55;
  font-style: italic;
  margin-bottom: 28px;
  text-align: center;
  padding: 18px 0;
  border-top: 1px solid rgba(138,122,101,0.15);
  border-bottom: 1px solid rgba(138,122,101,0.15);
}
.act-characters {
  font-size: 12px;
  letter-spacing: 0.18em;
  color: #6a5a45;
  line-height: 2;
}
.act-characters strong {
  color: #8a7a65;
  font-weight: 400;
  margin-right: 10px;
  letter-spacing: 0.3em;
}

/* 句子行 */
.line {
  max-width: 620px;
  margin: 0 auto 24px;
  font-size: clamp(16px, 2.7vw, 19px);
  line-height: 2.2;
  text-align: center;
  animation: fadeIn 0.9s ease;
}
.line.narration {
  color: #c9a961;
  font-style: italic;
}
.line.dialogue .speaker {
  color: #b8a888;
  margin-right: 12px;
  letter-spacing: 0.05em;
}
.line.dialogue.self .speaker {
  color: #d4a574;
  font-weight: 500;
}
.line.dialogue.mystic .speaker {
  color: #a0b8c8;
  font-style: italic;
}
.line.dialogue .text {
  color: #e8dcc8;
}
.line.action {
  color: #5e5040;
  font-style: italic;
  font-size: 0.9em;
  margin: 10px auto;
}
.line.final-narration {
  color: #d4b878;
  font-style: italic;
  border-top: 1px solid rgba(201,169,97,0.2);
  padding-top: 28px;
  margin-top: 28px;
  font-size: clamp(17px, 2.9vw, 20px);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 进度点 */
.progress {
  position: fixed; top: 26px; left: 50%; transform: translateX(-50%);
  z-index: 10; display: flex; gap: 12px;
}
.progress .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(138,122,101,0.25);
  transition: all 0.4s;
}
.progress .dot.active {
  background: #c9a961;
  box-shadow: 0 0 10px rgba(201,169,97,0.6);
  transform: scale(1.3);
}
.progress .dot.done { background: rgba(201,169,97,0.45); }

/* 继续提示 */
.continue-hint {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  font-size: 11px; letter-spacing: 0.45em; color: #5e5040;
  animation: pulse 2.6s ease-in-out infinite;
  z-index: 10;
  padding-left: 0.45em;
}

/* 结尾页 */
.end-text {
  max-width: 560px;
  text-align: center;
  margin-bottom: 48px;
}
.end-cta {
  font-size: clamp(22px, 4vw, 26px);
  letter-spacing: 0.35em;
  color: #c9a961;
  margin-bottom: 20px;
  padding-left: 0.35em;
  text-shadow: 0 0 24px rgba(201,169,97,0.3);
}
.end-note {
  font-size: 14px;
  color: #8a7a65;
  line-height: 2.2;
  font-style: italic;
}
.end-button {
  margin-top: 8px;
  padding: 14px 36px;
  border: 1px solid #5e5040;
  background: transparent;
  color: #b8a888;
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 0.35em;
  cursor: pointer;
  transition: all 0.3s;
  padding-left: calc(36px + 0.35em);
}
.end-button:hover {
  background: rgba(201,169,97,0.08);
  border-color: #c9a961;
  color: #c9a961;
}

.hidden { display: none !important; }

@media (max-width: 600px) {
  .screen { padding: 60px 18px 60px; }
  .line { font-size: 16.5px; line-height: 2.1; }
  .act-scene { font-size: 13px; }
}
</style>
</head>
<body>
<div class="fog"></div>

<div class="progress hidden" id="progress"></div>

<!-- 标题页 -->
<div class="screen" id="title-screen">
  <div class="title-main">渡山记</div>
  <div class="title-divider"></div>
  <div class="title-sub">开路将军 · 幻梦卡</div>
  <div class="title-quote">「当所有人都说此处无路时，<br>仍然愿意成为第一个走进去的人。」</div>
  <div class="title-hint">点 击 进 入</div>
</div>

<!-- 游戏页 -->
<div class="screen hidden" id="game-screen">
  <div id="game-content"></div>
</div>

<!-- 结尾页 -->
<div class="screen hidden" id="end-screen">
  <div class="end-text">
    <div class="end-cta">进 入 得 面</div>
    <div class="end-note">傩已见你的愿。<br>千年前那位将军，与那个少年，<br>如今都在你身上照面。</div>
  </div>
  <button class="end-button" id="restart">重 新 观 看</button>
</div>

<div class="continue-hint hidden" id="hint">点 击 继 续 ▽</div>

<script>
const acts = [
  {
    number: "第 一 幕",
    title: "断 路 之 村",
    scene: "深山之中，一座小村依崖而建。村口立着一块被苔藓覆盖的石碑，上刻「此路不通」四字。天色阴沉，云压山腰，远处山崩的碎石仍堆在村口道路上，荆棘已从石缝间疯长出来。",
    characters: "村中老者 · 我（少年，约十五六岁） · 围观村民数人",
    lines: [
      {type:"narration", text:"千年前，有一座山村，叫作石槛村。"},
      {type:"narration", text:"村口有一条路，原本通往山外的集镇。"},
      {type:"narration", text:"三年前，山崩断路，碎石封死了出口。"},
      {type:"narration", text:"从那以后，村里再没有人走出去，也没有外人走进来。"},
      {type:"narration", text:"村里的人渐渐相信：这条路，本就是断的。"},
      {type:"dialogue", speaker:"村中老者", text:"阿渡，你又在村口站着。路断了，看也是断的。"},
      {type:"dialogue", speaker:"我", self:true, text:"我知道。"},
      {type:"dialogue", speaker:"村中老者", text:"那就回去吧。你祖父病了三年，该陪着他。"}
    ]
  },
  {
    number: "第 二 幕",
    title: "祖 父 之 愿",
    scene: "屋内。土灶燃着柴火，光线昏黄。草席上躺着一位白发老人，呼吸微弱。墙上挂着一柄生锈的斧头，斧刃上有旧日的磨痕。",
    characters: "我 · 祖父（病重，卧于草席）",
    lines: [
      {type:"narration", text:"少年的祖父，是村里最后一个还记得路曾经通的人。"},
      {type:"narration", text:"他年轻时走过那条路，到山外买过盐、请过大夫。"},
      {type:"narration", text:"如今他病重，山外的药材送不进来。"},
      {type:"narration", text:"村里的人都认了命。"},
      {type:"dialogue", speaker:"祖父", text:"阿渡……"},
      {type:"dialogue", speaker:"我", self:true, text:"祖父，我在。"},
      {type:"dialogue", speaker:"祖父", text:"我想起……那条路。"},
      {type:"dialogue", speaker:"我", self:true, text:"哪条路？"},
      {type:"dialogue", speaker:"祖父", text:"通往山外的那条。我年轻时走过。"},
      {type:"dialogue", speaker:"祖父", text:"如今他们说，那是死路。"},
      {type:"dialogue", speaker:"祖父", text:"可我记得，它原本是通的。"},
      {type:"dialogue", speaker:"我", self:true, text:"（沉默良久）我知道。"}
    ]
  },
  {
    number: "第 三 幕",
    title: "无 人 肯 行",
    scene: "村中祠堂前，众人围坐。天将雨，风从山口灌入，吹动祠堂檐角的旧幡。",
    characters: "我 · 村中老者 · 数位村民",
    lines: [
      {type:"narration", text:"少年把祖父的话告诉了村里人。"},
      {type:"narration", text:"他说，他要带着斧头，去把那条断路砍开。"},
      {type:"narration", text:"没有人肯跟他去。"},
      {type:"dialogue", speaker:"村民甲", text:"那路断了三年，谁也开不了。"},
      {type:"dialogue", speaker:"村民乙", text:"山神不让通，你砍了又长。"},
      {type:"dialogue", speaker:"村中老者", text:"阿渡，你一个少年，能做什么？"},
      {type:"dialogue", speaker:"我", self:true, text:"我不知道能不能做成。"},
      {type:"dialogue", speaker:"我", self:true, text:"但祖父记得，它原本是通的。"},
      {type:"dialogue", speaker:"村民甲", text:"你祖父糊涂了，你也跟着糊涂？"}
    ]
  },
  {
    number: "第 四 幕",
    title: "雾 中 遇 人",
    scene: "山道废墟。巨大的碎石横亘在原路上，荆棘从石缝间疯长，雾气从谷底涌上来，浓得化不开。少年手持生锈的斧头，独自站在石前。身后是村，前方是无路。",
    characters: "我 · 戴面神秘人（雾中显现，身份未明）",
    lines: [
      {type:"narration", text:"少年砍了半日，雾越来越浓。"},
      {type:"narration", text:"他忽然发现，雾里站着一个人。"},
      {type:"narration", text:"那人戴着一面木面，看不清脸。"},
      {type:"dialogue", speaker:"我", self:true, text:"（惊）你是谁？"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"一个路过的人。"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"你来这里，想要什么？"},
      {type:"dialogue", speaker:"我", self:true, text:"祖父病重，山外的药送不进来。我想，把路砍开。"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"你一个人？"},
      {type:"dialogue", speaker:"我", self:true, text:"没有人肯跟我来。"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"他们说，这条路断了。"},
      {type:"dialogue", speaker:"我", self:true, text:"可它原本是通的。"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"是。它原本是通的。"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"路，不是等出来的。"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"我曾在更早之前，见过一个少年，也站在无路之地。"},
      {type:"dialogue", speaker:"我", self:true, text:"后来呢？"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"后来，他没有等。"},
      {type:"action", text:"神秘人隐入雾中，只余斧声在山间回响。"}
    ]
  },
  {
    number: "第 五 幕",
    title: "开 路",
    scene: "断路深处。碎石堆叠成墙，荆棘缠结如网。少年双手磨破，斧头卷刃。雾越来越浓，仿佛山要把他推回去。天色已无法分辨昼夜。",
    characters: "我 · 戴面神秘人",
    lines: [
      {type:"narration", text:"少年砍了一日一夜。"},
      {type:"narration", text:"石头太硬，斧头卷了刃。"},
      {type:"narration", text:"荆棘砍断一根，又长出两根。"},
      {type:"narration", text:"雾从四面涌来，像是要告诉少年：此路不通，回去吧。"},
      {type:"dialogue", speaker:"我", self:true, text:"（喘息）他们说得对，这条路，是断的。"},
      {type:"dialogue", speaker:"我", self:true, text:"（停斧）"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"（雾中出现）你为何停下？"},
      {type:"dialogue", speaker:"我", self:true, text:"我砍不动了。石头太硬，荆棘砍了又长。"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"你来此，是为了证明这条路通吗？"},
      {type:"dialogue", speaker:"我", self:true, text:"我不知道……"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"通不通，从来不是你一人说算的。"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"但你可以选择——做第一个走进去的人。"},
      {type:"dialogue", speaker:"我", self:true, text:"（沉默良久）……做第一个走进去的人。"},
      {type:"dialogue", speaker:"我", self:true, text:"（举起卷刃的斧）通不通，总要有人先走进去看。"},
      {type:"action", text:"一斧劈下，巨石裂出一道缝。光从缝中透入。"}
    ]
  },
  {
    number: "第 六 幕",
    title: "路 通",
    scene: "碎石崩落，荆棘退散。一条被掩埋三年的山道，在少年脚下重新显现。山外有风灌入，带着陌生草木的气味。远处山坳处露出集镇的一线灯火。",
    characters: "我",
    lines: [
      {type:"narration", text:"那一斧下去，石头裂了。"},
      {type:"narration", text:"不是因为少年力气大。"},
      {type:"narration", text:"而是因为这条路上，终于有一个人，先走了进来。"},
      {type:"narration", text:"路重新出现了。"},
      {type:"dialogue", speaker:"我", self:true, text:"（看着前方的路）原来……它真的还在。"},
      {type:"dialogue", speaker:"我", self:true, text:"（回头）你——"},
      {type:"narration", text:"少年回过头，那个戴面的人已经不在了。"},
      {type:"narration", text:"只余雾散开，和一条重新出现的路。"},
      {type:"dialogue", speaker:"我", self:true, text:"（向前迈步）祖父，我记得它原本是通的。"},
      {type:"action", text:"少年走下山外。雾散，山道蜿蜒。"}
    ]
  },
  {
    number: "第 七 幕",
    title: "归 路 与 得 面",
    scene: "数日后，村口。石碑「此路不通」被苔藓覆盖得更深。少年背着药囊从山道走来，身后是重新被踩出来的路。村民立在村口，无人言语。祖父被抬出，倚在门边。村口石碑旁，立着那个戴面的人。",
    characters: "我 · 村中老者 · 祖父（倚门而望） · 众村民 · 戴面神秘人",
    lines: [
      {type:"narration", text:"三日后，少年从山外回来。"},
      {type:"narration", text:"他带回了药材，也带回了一条路。"},
      {type:"narration", text:"村里人站在村口，看着他，没有人说话。"},
      {type:"dialogue", speaker:"村中老者", text:"……路，通了？"},
      {type:"dialogue", speaker:"我", self:true, text:"通了。"},
      {type:"dialogue", speaker:"祖父", text:"（倚门而望）我记得，它原本是通的。"},
      {type:"narration", text:"村口的石碑旁，立着那个戴面的人。"},
      {type:"narration", text:"少年走过去，这一次，他没有害怕。"},
      {type:"dialogue", speaker:"我", self:true, text:"你……一直都在？"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"（缓缓摘下面）我并非路过。"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"千年前，我也曾是一个少年，站在无路之地。"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"他们唤我——开路将军。"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"我今日来此，不是替你开路。"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"是要让你知道——在你之前，也曾有人先走进过那片无路之地。"},
      {type:"dialogue", speaker:"神秘人", mystic:true, text:"如今，你是那个先走进去的人了。"},
      {type:"action", text:"神秘人转身，走入山雾，不复再见。"},
      {type:"final-narration", text:"你求的是一条路。"},
      {type:"final-narration", text:"可这条路，已经有人在告诉你，它断了。"},
      {type:"final-narration", text:"千年前，曾有一位将军先走入无路之地；"},
      {type:"final-narration", text:"千年前的那一日，他曾遇见一个少年。"},
      {type:"final-narration", text:"如今，那个少年是你。"},
      {type:"final-narration", text:"你愿意，做下一个走进去的人吗？"}
    ]
  }
];

const titleScreen = document.getElementById("title-screen");
const gameScreen = document.getElementById("game-screen");
const endScreen = document.getElementById("end-screen");
const gameContent = document.getElementById("game-content");
const progressEl = document.getElementById("progress");
const hint = document.getElementById("hint");

let currentAct = 0;
let lineIndex = -1;

acts.forEach((_, i) => {
  const dot = document.createElement("div");
  dot.className = "dot";
  progressEl.appendChild(dot);
});

function updateProgress() {
  const dots = progressEl.querySelectorAll(".dot");
  dots.forEach((d, i) => {
    d.classList.remove("active", "done");
    if (i < currentAct) d.classList.add("done");
    if (i === currentAct) d.classList.add("active");
  });
}

function renderActHeader(act) {
  return `
    <div class="act-header">
      <div class="act-number">${act.number}</div>
      <div class="act-title">${act.title}</div>
      <div class="act-scene">${act.scene}</div>
      <div class="act-characters"><strong>在 场</strong>${act.characters}</div>
    </div>
  `;
}

function renderLine(line) {
  if (line.type === "narration") {
    return `<div class="line narration">${line.text}</div>`;
  } else if (line.type === "dialogue") {
    let cls = "dialogue";
    if (line.mystic) cls += " mystic";
    if (line.self) cls += " self";
    return `<div class="line ${cls}"><span class="speaker">${line.speaker}</span><span class="text">${line.text}</span></div>`;
  } else if (line.type === "action") {
    return `<div class="line action">${line.text}</div>`;
  } else if (line.type === "final-narration") {
    return `<div class="line final-narration">${line.text}</div>`;
  }
  return "";
}

function startAct(idx) {
  currentAct = idx;
  lineIndex = -1;
  gameContent.innerHTML = renderActHeader(acts[idx]);
  updateProgress();
  hint.classList.remove("hidden");
}

function appendLine(line) {
  const div = document.createElement("div");
  div.innerHTML = renderLine(line);
  const node = div.firstElementChild;
  gameContent.appendChild(node);
  setTimeout(() => {
    node.scrollIntoView({ behavior: "smooth", block: "center" });
  }, 80);
}

function nextStep() {
  const act = acts[currentAct];
  if (lineIndex === -1) {
    lineIndex = 0;
    if (act.lines.length > 0) appendLine(act.lines[0]);
  } else if (lineIndex < act.lines.length - 1) {
    lineIndex++;
    appendLine(act.lines[lineIndex]);
  } else {
    if (currentAct < acts.length - 1) {
      startAct(currentAct + 1);
    } else {
      gameScreen.classList.add("hidden");
      progressEl.classList.add("hidden");
      hint.classList.add("hidden");
      endScreen.classList.remove("hidden");
    }
  }
}

function startGame() {
  titleScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
  progressEl.classList.remove("hidden");
  hint.classList.remove("hidden");
  startAct(0);
}

function restart() {
  endScreen.classList.add("hidden");
  titleScreen.classList.remove("hidden");
  currentAct = 0;
  lineIndex = -1;
  gameContent.innerHTML = "";
  progressEl.querySelectorAll(".dot").forEach(d => d.classList.remove("active","done"));
}

titleScreen.addEventListener("click", startGame);
gameScreen.addEventListener("click", nextStep);
document.getElementById("restart").addEventListener("click", function(e){
  e.stopPropagation();
  restart();
});
</script>
</body>
</html>
